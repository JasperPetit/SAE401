<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Morpion</title>
    <link rel="stylesheet" href="morpion.css">
</head>
<body>
    <div class="container">
        <h1>Jeu de Morpion</h1>
        <div class="mode-selection">
            <button id="mode-pve-easy">Joueur vs IA (Facile)</button>
            <button id="mode-pve-hard">Joueur vs IA (Difficile)</button>
            <button id="mode-pvp">Joueur vs Joueur</button>
        </div>
        <div id="game-info">C'est au tour du joueur X</div>
        <div id="board" class="board">
            <div class="cell" data-cell-index="0"></div>
            <div class="cell" data-cell-index="1"></div>
            <div class="cell" data-cell-index="2"></div>
            <div class="cell" data-cell-index="3"></div>
            <div class="cell" data-cell-index="4"></div>
            <div class="cell" data-cell-index="5"></div>
            <div class="cell" data-cell-index="6"></div>
            <div class="cell" data-cell-index="7"></div>
            <div class="cell" data-cell-index="8"></div>
        </div>
        <button id="restart-button">Rejouer</button>
    </div>
    <script src="morpion.js"></script>
</body>
</html>
